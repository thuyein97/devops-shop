replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 250m
    memory: 256Mi

  limits:
    cpu: 1000m
    memory: 1Gi

probes:
  path: /health

ingress:
  enabled: false
  host: devops-shop.example.com

monitoring:
  enabled: false