name: CI

on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/API tests
        run: npm test

      - name: Application build
        run: npm run build

  docker:
    name: Docker Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write # REQUIRED for upload-sarif
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Trivy file scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-fs-results.sarif'
          exit-code: '0'

      - name: Upload Filesystem SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs-scan'

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          # Leave registry blank for Docker Hub. For GHCR use 'ghcr.io'
          registry: '' 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/devops-shop # Format: organization/repository
        run: docker build -t $DOCKER_REPO:${{ github.sha }} .

      - name: Trivy image scan
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/devops-shop
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.DOCKER_REPO }}:${{ github.sha }}'
          format: 'sarif'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-image-results.sarif'
          exit-code: '0'

      - name: Upload Image SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image-scan'      

      - name: Push Image to Docker Registry
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/devops-shop
        run: docker push $DOCKER_REPO:${{ github.sha }}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS OIDC Reachability
        run: |
          echo "Testing OIDC Authentication..."
          aws sts get-caller-identity