name: CI

on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/API tests
        run: npm test

      - name: Application build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy file scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Build Docker image
        run: docker build -t devops-shop:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-shop:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
      # 1. Authenticate with AWS using OIDC Role
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ secrets.AWS_ARN }} # Replace with your IAM Role ARN
          aws-region: ${{ secrets.AWS_REGION }}                                             # Replace with your AWS Region

      # 2. Test OIDC Authentication (Check IAM Identity)
      - name: Test AWS OIDC Reachability
        run: |
          echo "Testing OIDC Authentication..."
          aws sts get-caller-identity
