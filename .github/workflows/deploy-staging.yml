name: Deploy Staging

on:
  workflow_call:
    inputs:
      image-tag:
        description: Docker image tag to deploy
        required: true
        type: string
    secrets:
      AWS_ARN:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # -------------------------
      # AWS OIDC
      # -------------------------

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS OIDC
        run: |
          aws sts get-caller-identity

      # -------------------------
      # ECR Login
      # -------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # EKS
      # -------------------------

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Test EKS Access
        run: |
          kubectl get nodes
          kubectl get pods -A

      # -------------------------
      # Deploy
      # -------------------------

      - name: Deploy to EKS using Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-shop
          IMAGE_TAG: ${{ inputs.image-tag }}
          HELM_RELEASE_NAME: devops-shop-release
          HELM_CHART_PATH: ./helm/devops-shop

        run: |
          helm upgrade --install $HELM_RELEASE_NAME $HELM_CHART_PATH \
            --namespace staging \
            --create-namespace \
            -f $HELM_CHART_PATH/values-staging.yaml \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=does-not-exist \
            --wait \
            --atomic \
            --timeout 5m

      # -------------------------
      # Verification
      # -------------------------

      - name: Verify staging deployment
        run: |
          kubectl rollout status deployment/devops-shop-release-devops-shop \
            -n staging \
            --timeout=5m

          kubectl get pods -n staging
          kubectl get svc -n staging
